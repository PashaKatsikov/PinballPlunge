name: pinball_plunge_shell
description: "Pinball Plunge — a neon color-match arcade with a rotating wheel."
publish_to: 'none'

version: 1.0.1+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # WebView + surrounding gray-flow stack. Minor versions intentionally
  # differ from sibling projects — each app in the family ships with its
  # own pin set so byte-level plugin fingerprints diverge.
  webview_flutter: 4.13.1
  webview_flutter_android: 4.10.11
  shared_preferences: 2.5.3
  connectivity_plus: 7.2.0
  appsflyer_sdk: 6.17.9
  firebase_core: 4.11.0
  firebase_messaging: 16.4.0
  firebase_app_check: 0.4.5
  flutter_local_notifications: 20.1.0
  flutter_secure_storage: 10.2.0
  device_info_plus: 11.5.0
  http: 1.3.0
  url_launcher: 6.3.1
  clarity_flutter: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

  assets:
    - assets/generated/
    - assets/Pinball_Plunge_additional_assets/
    - assets/Pinball_Plunge_gameplay_assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/Pinball_Plunge_additional_assets/icon2.png"
  adaptive_icon_background: "#0B0B2E"
  adaptive_icon_foreground: "assets/Pinball_Plunge_additional_assets/icon2.png"
  min_sdk_android: 30
